# 読み辞書
# 台本の読み上げ文（say、なければ text）に出てくる語を、音声合成の直前にこの読みへ置き換える。
# - 長い語から順に置き換える。英字の大文字・小文字は区別しない
# - 字幕（画面の文字）は変わらない。変わるのは読み上げだけ
# - 書き換えると、その語を含む行だけが合成し直される
# - 個人の固有名詞など、リポジトリに入れたくない読みは readings.local.yaml に書く（同じ形式。あとから重なる）
値の表: あたいのひょう
右下がり: みぎさがり
左下がり: ひだりさがり
Anthropic: アンソロピック
数直線: すうちょくせん
二分音符: にぶおんぷ
四分音符: しぶおんぷ
八分音符: はちぶおんぷ
十六分音符: じゅうろくぶおんぷ
付点: ふてん
