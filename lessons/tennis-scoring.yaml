# 構成：テニスの点数の数え方（入門。約4分、11シーン）
#  1 はじめに   intro-1  ポイント・ゲーム・セット・マッチの4段（title・steps）
#  2 ゲーム     game-1   0・15・30・40（table values、列を順に）
#               game-2   サーバーの点を先に言う（table plain、作った例の進み方）
#               deuce-1  デュースとアドバンテージ（steps）
#  3 セット     set-1    6ゲーム先取・2ゲーム差（table plain）
#               tie-1    タイブレークの数え方（bullets）
#               tie-2    タイブレークのサーブの順番（table values、作った例）
#               match-1  マッチ：3セットか5セット（compare）
#  4 確認       check-1  30-40 からサーバーが2本続けて取ると？
#               check-2  タイブレーク方式で 6-5、5の側が取ると？
#  5 まとめ     end-1    箇条書き3項目
# 範囲の外：ノーアドバンテージ方式、最終セットの決まり（大会ごとに違う）、ダブルスのサーブの順番、コートの交代、審判のコールの言い方
# 決まりはすべて ITF「Rules of Tennis 2026」の規則 5（ゲーム）・6（セット）・7（マッチ）・14（サーブの交代）とタイブレークのサーブの順番で確かめた
format: lesson-cassette
version: 1
id: tennis-scoring
title: テニスの点数の数え方
kicker: スポーツ ・ ルールの基本
lang: ja
sources:
  - id: s1
    label: 国際テニス連盟（ITF）「Rules of Tennis 2026」規則 5〜7・14
    url: https://www.itftennis.com/media/7221/2026-rules-of-tennis-english.pdf
    note: ゲーム・セット・マッチの点の数え方、デュースとアドバンテージ、タイブレーク（7ポイント先取・2ポイント差、サーブは最初の1本のあと2本ずつ交代）。点の呼び方（ラブ・フィフティーンなど）のカタカナは日本での一般的な読み
chapters:
  - id: intro
    title: はじめに
    scenes:
      - id: intro-1
        sources: [s1]
        blocks:
          - {type: title, kicker: スポーツ ・ ルールの基本, text: テニスの点数の数え方}
          - type: steps
            items:
              - {title: ポイント, note: 1球ごとの点, at: 1, focus: [1]}
              - {title: ゲーム, note: ポイントを集めて取る, at: 2, focus: [2]}
              - {title: セット, note: ゲームを集めて取る, at: 2, focus: [2]}
              - {title: マッチ, note: セットを集めて勝つ（試合）, at: 2, focus: [2]}
        lines:
          - text: このカセットでは、テニスの点数の数え方を学びます。決まりは、国際テニス連盟の規則にもとづきます。
          - text: テニスの点数は、段階を重ねて数えます。いちばん小さい単位が、ポイントです。
          - text: ポイントを集めるとゲーム、ゲームを集めるとセット、セットを集めるとマッチ、つまり試合に勝ちます。
  - id: game
    title: ゲーム
    scenes:
      - id: game-1
        sources: [s1]
        blocks:
          - {type: title, kicker: ゲーム, text: "0・15・30・40"}
          - type: table
            style: values
            head: [ポイント, "0", "1", "2", "3", "4"]
            rows:
              - [呼び方, "0", "15", "30", "40", ゲーム]
            cols: [null, {at: 1, focus: [1]}, {at: 1, focus: [1]}, {at: 1, focus: [1]}, {at: 1, focus: [1]}, {at: 2, focus: [2]}]
        lines:
          - text: 1つのゲームの中では、取ったポイントの数を、そのまま呼びません。
          - text: 0、1、2、3ポイントを、0、15、30、40と呼びます。0は、ラブといいます。
            say: 0、1、2、3ポイントを、ラブ、フィフティーン、サーティ、フォーティと呼びます。0は、ラブといいます。
          - text: 4ポイント目を取ると、そのゲームの勝ちです。ただし、相手も40のときは、別の決まりがあります。
            say: 4ポイント目を取ると、そのゲームの勝ちです。ただし、相手も、フォーティのときは、別の決まりがあります。
      - id: game-2
        sources: [s1]
        blocks:
          - {type: title, kicker: 作った例, text: 1ゲームの進み方}
          - type: table
            head: [ポイントを取った人, スコア（サーバーが先）]
            widths: [1, 1]
            align: [center, center]
            rows:
              - {cells: [サーバー, "15 - 0"], at: 1, focus: [1]}
              - {cells: [レシーバー, "15 - 15"], at: 2, focus: [2]}
              - {cells: [サーバー, "30 - 15"], at: 3, focus: [3]}
              - {cells: [サーバー, "40 - 15"], at: 3, focus: [3]}
              - {cells: [サーバー, ゲーム], at: 4, focus: [4]}
        lines:
          - text: スコアは、サーブを打つ人、サーバーの点を先に言います。作った例で、1ゲームの進み方を見ます。
          - text: サーバーが取ると、15 - 0です。
            say: サーバーが取ると、フィフティーン、ラブです。
          - text: レシーバーが取ると、15 - 15で並びます。
            say: レシーバーが取ると、フィフティーン、フィフティーンで、並びます。
          - text: サーバーが続けて取ると、30 - 15、さらに40 - 15です。
            say: サーバーが続けて取ると、サーティ、フィフティーン、さらに、フォーティ、フィフティーンです。
          - text: ここでサーバーがもう1本取ると、4ポイント目なので、サーバーのゲームです。
  - id: deuce
    title: デュース
    scenes:
      - id: deuce-1
        sources: [s1]
        blocks:
          - {type: title, kicker: ゲーム, text: デュースとアドバンテージ}
          - type: steps
            items:
              - {title: "40 - 40 は デュース", note: 3ポイントずつ取った状態, at: 1, focus: [1]}
              - {title: 次を取った側が アドバンテージ, at: 2, focus: [2]}
              - {title: 続けてもう1本で ゲーム, note: 落とすとデュースに戻る, at: 3, focus: [3]}
        lines:
          - text: では、両方が40まで来たら、どうなるでしょう。
            say: では、両方が、フォーティまで来たら、どうなるでしょう。
          - text: 両方が3ポイントずつ取ると、40 - 40とは言わず、デュースと呼びます。
            say: 両方が3ポイントずつ取ると、フォーティ、フォーティとは言わず、デュースと呼びます。
          - text: デュースのあと、次のポイントを取った側が、アドバンテージです。
          - text: アドバンテージの側が、続けてもう1本取ればゲーム。落とせば、またデュースに戻ります。
          - text: つまりデュースのあとは、2ポイント続けて取るまで、ゲームは終わりません。
  - id: set
    title: セットとマッチ
    scenes:
      - id: set-1
        sources: [s1]
        blocks:
          - {type: title, kicker: セット, text: 6ゲームを先に、2ゲーム差で}
          - type: table
            head: [ゲームカウント, どうなるか]
            widths: [1, 2]
            align: [center, left]
            rows:
              - {cells: ["6 - 4", セットを取る], at: 1, focus: [1]}
              - {cells: ["6 - 5", まだ続く（2ゲーム差がない）], at: 2, focus: [2]}
              - {cells: ["7 - 5", セットを取る], at: 2, focus: [2]}
              - {cells: ["6 - 6", タイブレークで決める], at: 3, focus: [3]}
        lines:
          - text: ゲームを集めるとセットです。先に6ゲームを取り、相手と2ゲーム差があれば、そのセットの勝ちです。
          - text: たとえば6 - 4なら、2ゲーム差があるので、セットを取ります。
            say: たとえば、6たい4なら、2ゲーム差があるので、セットを取ります。
          - text: 6 - 5では、まだ1ゲーム差なので続けます。7 - 5になれば、セットを取ります。
            say: 6たい5では、まだ1ゲーム差なので、続けます。7たい5になれば、セットを取ります。
          - text: タイブレーク方式のセットでは、6 - 6になると、タイブレークという特別なゲームで決めます。
            say: タイブレーク方式のセットでは、6たい6になると、タイブレークという、特別なゲームで決めます。
      - id: tie-1
        sources: [s1]
        blocks:
          - {type: title, kicker: セット, text: タイブレーク}
          - type: bullets
            items:
              - {text: "点は 0、1、2、3…と数える", at: 0, focus: [0]}
              - {text: "**7ポイント**を先に、**2ポイント差**で取る", at: 1, focus: [1]}
              - {text: "取った側が、セットを取る（7 - 6）", at: 2, focus: [2]}
        lines:
          - text: タイブレークでは、15、30、40ではなく、0、1、2、3と、ふつうに数えます。
            say: タイブレークでは、フィフティーン、サーティ、フォーティではなく、0、1、2、3と、ふつうに数えます。
          - text: 先に7ポイントを取った側の勝ちです。ただし、ここでも2ポイント差が必要です。
          - text: タイブレークを取った側が、そのセットを取ります。セットのスコアは、7 - 6です。
            say: タイブレークを取った側が、そのセットを取ります。セットのスコアは、7たい6です。
      - id: tie-2
        sources: [s1]
        blocks:
          - {type: title, kicker: 作った例 ・ Aさんから打つとき, text: タイブレークのサーブの順番}
          - type: table
            style: values
            head: [ポイント, "1", "2・3", "4・5", "6・7"]
            rows:
              - [サーブ, A, B, A, B]
            cols: [null, {at: 1, focus: [1]}, {at: 2, focus: [2]}, {at: 2, focus: [2]}, {at: 2, focus: [2]}]
        lines:
          - text: タイブレークでは、サーブの順番も変わります。Aさんがサーブを打つ番だったとします。
            say: タイブレークでは、サーブの順番も変わります。エーさんが、サーブを打つ番だったとします。
          - text: 最初の1ポイントだけ、Aさんがサーブします。
            say: 最初の1ポイントだけ、エーさんが、サーブします。
          - text: そのあとは、Bさん、Aさんと、2ポイントずつ交代します。
            say: そのあとは、ビーさん、エーさんと、2ポイントずつ交代します。
      - id: match-1
        sources: [s1]
        blocks:
          - {type: title, kicker: マッチ, text: セットを集めて、試合に勝つ}
          - type: compare
            arrow: false
            at: 1
            left: {label: 3セットマッチ, title: 2セットを先に取る}
            right: {label: 5セットマッチ, title: 3セットを先に取る}
        lines:
          - text: セットを集めると、マッチ、つまり試合の勝ち負けが決まります。
          - text: 3セットマッチなら、セットを2つ。5セットマッチなら、セットを3つ、先に取った側の勝ちです。
  - id: check
    title: 確認
    scenes:
      - id: check-1
        kind: quiz
        sources: [s1]
        blocks:
          - type: quiz
            question: "30 - 40 から、サーバーが2本続けて取ると、スコアは？"
            answer: "1本目でデュース、2本目でサーバーのアドバンテージ（まだゲームではない）"
            answer_at: 1
        lines:
          - text: 止めて考えましょう。30 - 40から、サーバーが2本続けてポイントを取ると、スコアはどうなるでしょう？
            say: 止めて考えましょう。サーティ、フォーティから、サーバーが、2本続けてポイントを取ると、スコアはどうなるでしょう？
            pause: true
          - text: 1本目で40 - 40、つまりデュース。2本目で、サーバーのアドバンテージです。まだゲームではありません。
            say: 1本目で、フォーティ、フォーティ、つまりデュース。2本目で、サーバーのアドバンテージです。まだ、ゲームではありません。
      - id: check-2
        kind: quiz
        sources: [s1]
        blocks:
          - type: quiz
            question: "タイブレーク方式のセットで 6 - 5。次のゲームを 5 の側が取ると？"
            answer: "6 - 6 で並ぶので、タイブレークで決める"
            answer_at: 1
        lines:
          - text: もう一問。タイブレーク方式のセットで、6 - 5です。次のゲームを、5ゲームの側が取ると、どうなるでしょう？
            say: もう一問。タイブレーク方式のセットで、6たい5です。次のゲームを、5ゲームの側が取ると、どうなるでしょう？
            pause: true
          - text: 6 - 6で並ぶので、タイブレークで、このセットを決めます。
            say: 6たい6で並ぶので、タイブレークで、このセットを決めます。
  - id: end
    title: まとめ
    scenes:
      - id: end-1
        sources: [s1]
        blocks:
          - {type: title, text: まとめ}
          - type: bullets
            items:
              - {text: "ゲーム：0・15・30・40。デュースのあとは2本続けて", at: 0, focus: [0]}
              - {text: "セット：6ゲーム先取・2ゲーム差。6 - 6 はタイブレーク", at: 1, focus: [1]}
              - {text: "マッチ：3セットなら2つ、5セットなら3つ先取", at: 2, focus: [2]}
        lines:
          - text: ゲームは、0、15、30、40と数えます。デュースのあとは、2ポイント続けて取ると勝ちです。
            say: ゲームは、ラブ、フィフティーン、サーティ、フォーティと数えます。デュースのあとは、2ポイント続けて取ると勝ちです。
          - text: セットは、6ゲームを先に、2ゲーム差で取ります。6 - 6なら、タイブレークで決めます。
            say: セットは、6ゲームを先に、2ゲーム差で取ります。6たい6なら、タイブレークで決めます。
          - text: マッチは、3セットマッチならセットを2つ、5セットマッチなら3つ、先に取った側の勝ちです。
